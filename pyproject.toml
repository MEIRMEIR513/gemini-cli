[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-cli"
version = "0.1.0"
description = "Terminal chat client for Google Gemini web app (gemini-webapi) with a full Textual TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gemini_webapi>=2.1",
    "textual>=1.0",
    "python-bidi>=0.6.0",
]

[project.scripts]
gemini-cli = "gemini_cli.app:run"

[tool.setuptools.packages.find]
where = ["src"]
